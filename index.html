<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oceane Digital Photo Booth ♡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --soft-pink: #fff5f7; --accent-pink: #fbcfe8; --text-color: #704f5e; }
        body { background-color: var(--soft-pink); font-family: 'Quicksand', sans-serif; color: var(--text-color); margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .cute-heading { font-family: 'Cherry Bomb One', cursive; }
        .viewport-container { width: 100%; max-width: 400px; height: 95vh; max-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; z-index: 10; }
        .instax-card { background: white; padding: 12px 12px 40px 12px; box-shadow: 0 15px 35px rgba(244, 114, 182, 0.15); border-radius: 4px; width: 100%; display: flex; flex-direction: column; }
        .camera-box { background: #f8fafc; width: 100%; aspect-ratio: 4/5; overflow: hidden; position: relative; border-radius: 2px; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .grid-option { background: white; border: 2px solid var(--accent-pink); border-radius: 16px; padding: 18px; width: 100%; transition: all 0.2s ease; cursor: pointer; text-align: center; font-weight: bold; }
        .grid-option.active { background: #fdf2f8; border-color: #f472b6; transform: scale(1.02); }
        
        /* Preview Grid Styles */
        .preview-slots { display: grid; gap: 8px; margin-top: 15px; width: 100%; }
        .slot { background: #f1f5f9; border-radius: 4px; aspect-ratio: 1; overflow: hidden; border: 1px dashed #cbd5e1; }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
        
        @keyframes softFadeInUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-soft { animation: softFadeInUp 0.6s ease-out forwards; }
        .flash-effect { animation: flashAnim 0.4s ease-out; }
        @keyframes flashAnim { 0% { background: white; opacity: 1; } 100% { background: transparent; opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="flash" class="fixed inset-0 z-[200] pointer-events-none"></div>
    
    <div class="viewport-container">
        <div id="step-intro" class="w-full text-center flex flex-col items-center justify-center animate-soft">
            <h1 class="cute-heading text-6xl mb-1 tracking-tight">Oceane</h1>
            <p class="text-sm opacity-70 tracking-[0.3em] mb-12 uppercase font-bold">Digital Photo Booth ♡</p>
            <button onclick="goToGrid()" class="w-full bg-white border-2 border-pink-200 text-pink-500 font-bold py-4 rounded-full shadow-[0_5px_0_#fbcfe8] active:translate-y-1 transition-all uppercase tracking-widest text-lg">ENTER BOOTH ♡</button>
        </div>

        <div id="step-grid" class="hidden w-full space-y-4 animate-soft flex flex-col items-center">
            <h2 class="cute-heading text-3xl text-center mb-6">Select Layout</h2>
            <div onclick="pick('single')" class="grid-option" id="opt-single">SINGLE SHOT</div>
            <div onclick="pick('2x2')" class="grid-option" id="opt-2x2">QUAD FRAME (4 SHOTS)</div>
            <div onclick="pick('strip')" class="grid-option" id="opt-strip">4-CUT STRIP</div>
            <button id="grid-next" onclick="goToBooth()" class="w-full mt-6 bg-pink-200 text-white font-bold py-4 rounded-full transition-all uppercase tracking-widest">CONTINUE</button>
        </div>

        <div id="step-booth" class="hidden w-full flex flex-col items-center animate-soft">
            <div class="instax-card mb-4">
                <div class="camera-box">
                    <video id="video" autoplay playsinline></video>
                    <div id="countdown" class="absolute inset-0 flex items-center justify-center text-8xl cute-heading text-white hidden bg-pink-200/20 backdrop-blur-sm"></div>
                </div>
                
                <div id="preview-grid" class="preview-slots grid-cols-4 hidden">
                    <div class="slot" id="slot-0"></div>
                    <div class="slot" id="slot-1"></div>
                    <div class="slot" id="slot-2"></div>
                    <div class="slot" id="slot-3"></div>
                </div>
                <div id="single-preview-text" class="text-center mt-4 hidden">
                    <p class="cute-heading text-xl opacity-20">Oceane ♡</p>
                </div>
            </div>
            
            <button id="snap-btn" onclick="startCapture()" class="w-20 h-20 bg-white border-[8px] border-pink-100 rounded-full shadow-lg active:scale-95 transition-all"></button>
            <p id="snap-label" class="text-[10px] font-bold opacity-40 mt-4 tracking-widest uppercase">Tap to start session</p>
        </div>

        <div id="step-result" class="hidden w-full flex flex-col items-center animate-soft">
            <div class="instax-card mb-6 shadow-2xl">
                <div class="bg-white overflow-hidden"><img id="final-image" class="w-full h-auto"></div>
                <div class="py-4 flex items-center justify-center"><p class="cute-heading text-xl opacity-60">Oceane Photo Booth ♡</p></div>
            </div>
            <div class="flex gap-2 w-full px-2">
                <button onclick="downloadImg()" class="flex-1 bg-pink-400 text-white font-bold py-4 rounded-2xl text-xs uppercase shadow-md">SAVE</button>
                <button onclick="location.reload()" class="flex-1 bg-white border border-pink-100 text-pink-300 font-bold py-4 rounded-2xl text-xs uppercase">NEW</button>
            </div>
        </div>
    </div>

    <script>
        let mode = ''; let photos = []; const video = document.getElementById('video'); const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        function goToGrid() { document.getElementById('step-intro').classList.add('hidden'); document.getElementById('step-grid').classList.remove('hidden'); }
        
        function pick(m) { 
            mode = m; 
            document.querySelectorAll('.grid-option').forEach(el => el.classList.remove('active'));
            document.getElementById('opt-'+m).classList.add('active');
            const btn = document.getElementById('grid-next'); btn.style.backgroundColor = '#f472b6'; btn.innerText = "READY! ♡";
        }

        async function goToBooth() {
            if(!mode) return;
            document.getElementById('step-grid').classList.add('hidden');
            document.getElementById('step-booth').classList.remove('hidden');
            
            if(mode !== 'single') document.getElementById('preview-grid').classList.remove('hidden');
            else document.getElementById('single-preview-text').classList.remove('hidden');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { aspectRatio: 4/5, facingMode: "user" } });
                video.srcObject = stream;
            } catch(e) { alert("Camera error ♡"); }
        }

        async function startCapture() {
            document.getElementById('snap-btn').style.opacity = '0.3';
            document.getElementById('snap-btn').style.pointerEvents = 'none';
            const total = mode === 'single' ? 1 : 4;
            photos = [];
            
            for(let i=0; i<total; i++) {
                document.getElementById('snap-label').innerText = `GET READY... (${i+1}/${total})`;
                await runCountdown(3);
                const data = capture();
                if(mode !== 'single') fillSlot(i, data);
                await new Promise(r => setTimeout(r, 600));
            }
            renderFinal();
        }

        function runCountdown(s) {
            return new Promise(res => {
                const countEl = document.getElementById('countdown');
                countEl.classList.remove('hidden');
                let c = s; countEl.innerText = c;
                const itv = setInterval(() => {
                    c--; if(c > 0) countEl.innerText = c;
                    else { clearInterval(itv); countEl.classList.add('hidden'); res(); }
                }, 800);
            });
        }

        function capture() {
            document.getElementById('flash').classList.add('flash-effect');
            setTimeout(() => document.getElementById('flash').classList.remove('flash-effect'), 400);
            const tmp = document.createElement('canvas');
            tmp.width = 800; tmp.height = 1000;
            const tCtx = tmp.getContext('2d');
            tCtx.translate(800, 0); tCtx.scale(-1, 1);
            tCtx.drawImage(video, 0, 0, 800, 1000);
            const data = tmp.toDataURL('image/png');
            photos.push(data);
            return data;
        }

        function fillSlot(index, data) {
            const slot = document.getElementById(`slot-${index}`);
            if(slot) slot.innerHTML = `<img src="${data}" class="animate-soft">`;
        }

        function renderFinal() {
            if(mode === 'single') {
                canvas.width = 800; canvas.height = 1000;
                const img = new Image(); img.onload = () => { ctx.drawImage(img, 0, 0); finalize(); }; img.src = photos[0];
            } else if(mode === '2x2') {
                canvas.width = 800; canvas.height = 800;
                ctx.fillStyle = "white"; ctx.fillRect(0,0,800,800);
                let loaded = 0;
                photos.forEach((p, i) => {
                    const img = new Image(); img.onload = () => {
                        const x = (i%2)*405; const y = Math.floor(i/2)*405;
                        ctx.drawImage(img, x, y, 395, 395);
                        if(++loaded === 4) finalize();
                    }; img.src = p;
                });
            } else if(mode === 'strip') {
                canvas.width = 400; canvas.height = 1200;
                ctx.fillStyle = "white"; ctx.fillRect(0,0,400,1200);
                let loaded = 0;
                photos.forEach((p, i) => {
                    const img = new Image(); img.onload = () => {
                        ctx.drawImage(img, 10, 10 + (i*295), 380, 285);
                        if(++loaded === 4) finalize();
                    }; img.src = p;
                });
            }
        }

        function finalize() {
            document.getElementById('step-booth').classList.add('hidden');
            document.getElementById('step-result').classList.remove('hidden');
            document.getElementById('final-image').src = canvas.toDataURL('image/png');
        }

        function downloadImg() {
            const link = document.createElement('a');
            link.download = 'Oceane_Digital.png';
            link.href = document.getElementById('final-image').src;
            link.click();
        }
    </script>
</body>
</html>
